# Предметная область: настройка веб-сервиса
port is 0b1111101000
workers is 0b100
timeout is ^{port 0b11 *}

table(
    service => [[shop-api]],
    listen => table(
        host => [[0.0.0.0]],
        port => ^{port}
    ),
    pool => table(
        workers => ^{workers},
        queue => ^{workers 0b1000 *},
        limits => << ^{workers 1 +}, 0b1010, ^{timeout} >>
    ),
    hosts => << [[a.example.com]], [[b.example.com]] >>
)
