# Предметная область: геометрия, прямоугольный треугольник
a is 0b11
b is 0b100
c is ^{a a * b b * + sqrt}

table(
    task => [[Прямоугольный треугольник]],
    legs => << ^{a}, ^{b} >>,
    hypotenuse => ^{c},
    perimeter => ^{a b + c +},
    doubleArea => ^{a b * 0b10 *},
    points => <<
        table(name => [[A]], x => 0b0, y => 0b0),
        table(name => [[B]], x => ^{a}, y => 0b0),
        table(name => [[C]], x => 0b0, y => ^{b})
    >>
)
